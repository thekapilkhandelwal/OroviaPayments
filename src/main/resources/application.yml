spring:
  application:
    name: orovia-payment
  datasource:
    url: jdbc:postgresql://localhost:5432/orovia
    username: orovia
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  redis:
    host: localhost
    port: 6379
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.orovia.payment: DEBUG

payment:
  gateway:
    mock:
      hmacSecret: mock-secret

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:orovia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379
logging:
  level:
    root: WARN
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/orovia
    username: ${DB_USER:orovia}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
logging:
  level:
    root: INFO
