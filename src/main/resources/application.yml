spring:
  application:
    name: orovia-payment
  datasource:
    url: jdbc:postgresql://localhost:5432/orovia
    username: orovia
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
  redis:
    host: localhost
    port: 6379
  cache:
    type: redis
  threads:
    virtual:
      enabled: true
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

logging:
  level:
    root: INFO
    com.orovia.payment: DEBUG

otel:
  exporter:
    logging:
      enabled: true

payment:
  gateway:
    mock:
      hmacSecret: mock-secret
  rate-limit:
    create-order-permit-per-second: 200
    webhook-permit-per-second: 500
  cache:
    status-ttl-seconds: 60
  shards:
    total: 8
    region-hint: us-east
eventing:
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    payment-topic: payments.v1
    refund-topic: refunds.v1
    ledger-topic: ledger.v1
    settlement-topic: settlements.v1

resilience4j:
  circuitbreaker:
    instances:
      payment-gateway:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 50
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
  retry:
    instances:
      payment-gateway:
        maxRetryAttempts: 3
        waitDuration: 500ms
        exponentialBackoffMultiplier: 1.5
        enableExponentialBackoff: true

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:orovia;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  redis:
    host: localhost
    port: 6379
logging:
  level:
    root: WARN
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/orovia
    username: ${DB_USER:orovia}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
logging:
  level:
    root: INFO
